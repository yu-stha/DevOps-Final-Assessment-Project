name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout PULL|Clone Code
        uses: actions/checkout@v5

      - name: build container
        run: docker build -t web:1.0 .

  # Sonar stage from the original is paused: it needs SONAR_TOKEN and
  # SONAR_HOST_URL secrets pointing at a SonarQube server. Re-enable later.

  testing:
    needs: build
    runs-on: self-hosted

    steps:
      - name: testing
        run: echo testing

  deploy:
    needs: testing
    runs-on: self-hosted

    steps:
      - name: Replace and start container
        run: |
          docker rm -f test || true
          docker run -d --name test -p 8088:8080 web:1.0

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8088 && exit 0
            sleep 2
          done
          echo "Site did not respond on 8088"
          exit 1