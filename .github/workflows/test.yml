name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout PULL|Clone Code
        uses: actions/checkout@v5

      - name: build container
        run: docker build -t web:1.0 .

  sonar:
    needs: build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  testing:
    needs: sonar
    runs-on: self-hosted

    steps:
      - name: testing
        run: echo testing

  deploy:
    needs: testing
    runs-on: self-hosted

    steps:
      - name: Replace and start container
        run: |
          docker rm -f test || true
          docker run -d --name test -p 8088:8080 web:1.0

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8088 && exit 0
            sleep 2
          done
          echo "Site did not respond on 8088"
          exit 1